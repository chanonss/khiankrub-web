    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { display: flex; flex-direction: column; min-height: 100vh; background-image: var(--pattern); background-size: 48px 48px;

    .brand svg { width: 48px; height: 48px; }
    .brand .word span { color: var(--accent); }
    h1 { margin: 14px 0 40px; font-size: 24px; font-weight: 600; line-height: 1.4; }
    .apps { display: flex; flex-wrap: wrap; justify-content: center; gap: 32px 48px; margin: 0; padding: 0; list-style: none; }
    .app { width: 136px; display: flex; flex-direction: column; align-items: center; color: inherit; text-decoration: none; border-radius: 18px; padding: 10px 0 12px; }
    .app svg { width: 96px; height: 96px; display: block; border-radius: 22px; }
    a.app:hover svg, a.app:focus-visible svg { outline: 3px solid var(--ring); outline-offset: 4px; }
    a.app:focus-visible { outline: none; }
    .name { margin-top: 14px; font-size: 17px; font-weight: 600; }
    .kind { font-size: 12px; color: var(--sub); }
    .soon { cursor: default; }
    .soon svg { opacity: .35; filter: saturate(.5); }
    .soon .name, .soon .kind { opacity: .6; }
    .wait { margin-top: 6px; font-size: 12px; color: var(--wait); }
    footer { padding: 16px; text-align: center; font-size: 12px; color: var(--sub); }
    footer a { color: var(--text); }
    @media (max-width: 420px) { .brand { font-size: 22px; } .brand svg { width: 40px; height: 40px; } h1 { font-size: 20px; margin-bottom: 28px; } .apps { gap: 20px 10px; } .app { width: 104px; } .app svg { width: 72px; height: 72px; border-radius: 17px; } .name { font-size: 15px; } .kind { font-size: 11px; } }
